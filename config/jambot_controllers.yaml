controller_manager:
  ros__parameters:
    update_rate: 20  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    jambot_base_controller:
      type: diff_drive_controller/DiffDriveController

      

jambot_base_controller:
  ros__parameters:
    left_wheel_names: ["left_wheel_joint"]
    right_wheel_names: ["right_wheel_joint"]
    wheel_separation: 0.173
    #wheels_per_side: 1  # actually 2, but both are controlled by 1 signal
    wheel_radius: 0.034
    wheel_separation_multiplier: 1.0
    left_wheel_radius_multiplier: 1.0
    right_wheel_radius_multiplier: 1.0
    publish_rate: 50.0
    odom_frame_id: odom
    base_frame_id: base_link
    pose_covariance_diagonal : [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    open_loop: false
    enable_odom_tf: false
    # Bumped from 0.5s: live testing showed read()/write() cycles
    # intermittently blocking 145-325ms (see kRetryTimeoutMs in
    # arduino_comms.cpp, now also fixed), which was enough to make
    # diff_drive_controller drop joystick commands as "too old" and leave
    # the robot barely responding. 1.0s covers that jitter with margin
    # without fully giving up the timeout's job of stopping the robot if
    # commands actually stop arriving (a real, if small, safety tradeoff --
    # don't raise this further without a reason).
    cmd_vel_timeout: 1.0
    use_stamped_vel: true

    #experimental

    # Velocity and acceleration limits
    # Whenever a min_* is unspecified, default to -max_*
    linear.x.has_velocity_limits: true
    linear.x.has_acceleration_limits: true
    linear.x.has_jerk_limits: false
    # Matches controller_node's FAST speed mode (0.35 m/s, cut sharply from
    # 1.0 per live testing -- it was uncontrollably fast for manual driving).
    # Raising this alone doesn't make the robot go faster than commanded --
    # it's a ceiling, not a default -- but it must be >= the highest speed
    # mode or diff_drive_controller silently clips FAST below its intended
    # value.
    linear.x.max_velocity: 0.35
    linear.x.min_velocity: -0.35
    linear.x.max_acceleration: 0.7
    linear.x.max_jerk: 0.0
    linear.x.min_jerk: 0.0

    angular.z.has_velocity_limits: true
    angular.z.has_acceleration_limits: true
    angular.z.has_jerk_limits: false
    # Must be >= controller_node's kMaxAngularSpeed (4.5 rad/s, bumped from
    # 3.5 per live testing -- turning felt slow relative to linear speed) or
    # diff_drive_controller silently clips turning commands below what the
    # joystick asked for. Do not raise this further without checking it's
    # actually achievable: 30 rad/s would need ~729 RPM/wheel at this robot's
    # wheel geometry, above even the firmware's own 600 RPM safety clamp
    # (see kMaxSafeRpm in arduino_comms.cpp).
    angular.z.max_velocity: 4.5
    angular.z.min_velocity: -4.5
    angular.z.max_acceleration: 19.0
    angular.z.min_acceleration: -19.0
    angular.z.max_jerk: 0.0
    angular.z.min_jerk: 0.0
